[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jireumak-auto-healing"
version = "0.1.0"
description = "Auto Healing MVP for the Jireumak consumption coaching API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
